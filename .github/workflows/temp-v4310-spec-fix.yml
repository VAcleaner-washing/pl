name: TEMP v4.3.10 Spec Wording

on:
  push:
    branches:
      - qa/v4.3.10-client-card-edit-mode
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align v4.3.10 test wiring record
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/VAcleaner-SYSTEM-SPEC.md')
          s=p.read_text(encoding='utf-8')
          old='- `scripts/test-v4-3-10-client-card-edit-mode.mjs` via canonical `test:client-card-mobile`.\n- `scripts/test-mobile-client-card.py` validates read → edit → done disclosure state and rejects duplicate visible contact blocks at 320 / 390 / 430 px.'
          new='- `scripts/test-v4-3-10-client-card-edit-mode.mjs` via canonical `test:pwa-static`.\n- `scripts/test-mobile-client-card.py` via canonical `test:client-card-mobile` validates read → edit → done disclosure state and rejects duplicate visible contact blocks at 320 / 390 / 430 px.'
          if old not in s:
              raise SystemExit('expected v4.3.10 test wording not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/VAcleaner-SYSTEM-SPEC.md
          git commit -m 'docs: align v4.3.10 QA wiring'
          git push origin HEAD:qa/v4.3.10-client-card-edit-mode

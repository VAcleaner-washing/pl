name: TEMP v4.3.12 apply

on:
  push:
    branches:
      - qa/v4.3.12-admin-time-logistics

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'feat: admin exact time and two-leg logistics') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v4.3.12-admin-time-logistics
          fetch-depth: 0
      - name: Apply v4.3.12 patch
        run: python scripts/temp_apply_v4312.py
      - name: Commit patch and remove temporary helpers
        shell: bash
        run: |
          rm scripts/temp_apply_v4312.py
          rm .github/workflows/temp-v4312-apply.yml
          git config user.name "VAcleaner-washing"
          git config user.email "vacleaner.washing@gmail.com"
          git add -A
          git commit -m "feat: admin exact time and two-leg logistics"
          git push origin HEAD:qa/v4.3.12-admin-time-logistics

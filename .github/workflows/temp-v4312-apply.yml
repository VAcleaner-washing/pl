name: TEMP v4.3.12 apply
on:
  push:
    branches:
      - qa/v4.3.12-admin-time-logistics
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v4.3.12-admin-time-logistics
          fetch-depth: 0
      - name: Apply reviewed v4.3.12 patch and self-remove
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root=Path('.')
          def must_replace(path, old, new, count=1):
              p=root/path
              s=p.read_text(encoding='utf-8')
              actual=s.count(old)
              if actual!=count:
                  raise SystemExit(f'{path}: expected {count} occurrences, got {actual}: {old[:120]!r}')
              p.write_text(s.replace(old,new),encoding='utf-8')

          # Functional release/cache generation: this change touches the canonical admin runtime.
          release=json.loads((root/'release.json').read_text(encoding='utf-8'))
          release.update({
              'version':'4.3.12',
              'build':4312,
              'releasedAt':'2026-09-06',
              'label':'VAcleaner v4.3.12 — ADMIN FLEX TIME + TWO-LEG LOGISTICS'
          })
          (root/'release.json').write_text(json.dumps(release,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          admin_path=Path('assets/admin-v250.js')
          old_time='''function timeChipPicker(name,value){return `<div class="time-chip-picker" data-time-picker="${name}"><input type="hidden" name="${name}" value="${value}"><div class="time-chip-list"></div></div>`}\nfunction bindTimeWindows(form){['pickup','return'].forEach(kind=>{const windowName=kind+'Window',timeName=kind+'Time',picker=form.querySelector(`[data-time-picker="${timeName}"]`),hidden=picker?.querySelector('input');if(!picker||!hidden)return;const draw=()=>{const code=form.querySelector(`input[name="${windowName}"]:checked`)?.value||'morning',s=getSlots(),start=code==='morning'?s.morningStart:s.eveningStart,end=code==='morning'?s.morningEnd:s.eveningEnd,vals=timesBetween(start,end),selected=vals.includes(hidden.value)?hidden.value:start;hidden.value=selected;picker.querySelector('.time-chip-list').innerHTML=vals.map(v=>`<button type="button" class="time-chip ${v===selected?'active':''}" data-time="${v}">${v}</button>`).join('');picker.querySelectorAll('.time-chip').forEach(btn=>btn.onclick=()=>{hidden.value=btn.dataset.time;picker.querySelectorAll('.time-chip').forEach(x=>x.classList.toggle('active',x===btn))})};form.querySelectorAll(`input[name="${windowName}"]`).forEach(r=>r.onchange=draw);draw()})}'''
          new_time='''function timeChipPicker(name,value){return `<div class="time-chip-picker admin-exact-time-picker" data-time-picker="${name}"><input type="time" name="${name}" value="${value}" step="60" aria-label="Точний час"><small class="admin-time-tariff-hint"></small></div>`}\nfunction bindTimeWindows(form){['pickup','return'].forEach(kind=>{const windowName=kind+'Window',timeName=kind+'Time',picker=form.querySelector(`[data-time-picker="${timeName}"]`),timeInput=picker?.querySelector(`input[name="${timeName}"]`);if(!picker||!timeInput)return;const choice=form.querySelector(`input[name="${windowName}"]`)?.closest('.window-choice');if(choice){choice.hidden=true;choice.setAttribute('aria-hidden','true')}const sync=()=>{const s=getSlots(),time=String(timeInput.value||s.morningStart),code=slotForTime(time),radio=form.querySelector(`input[name="${windowName}"][value="${code}"]`);if(radio&&!radio.checked)radio.checked=true;if(radio)radio.dispatchEvent(new Event('change',{bubbles:true}));const dateInput=form.querySelector(`[name="${kind==='pickup'?'startDate':'returnDate'}"]`),hint=picker.querySelector('.admin-time-tariff-hint'),weekend=dateInput?.value?CORE.isWeekendTariffMoment(dateInput.value,code):false;if(hint)hint.textContent=`Будь-який час · тарифний момент: ${weekend?'вихідний':'будній'} · межа вечора ${s.eveningStart}`};timeInput.addEventListener('input',sync);timeInput.addEventListener('change',sync);form.querySelector(`[name="${kind==='pickup'?'startDate':'returnDate'}"]`)?.addEventListener('change',sync);sync()})}'''
          must_replace(admin_path,old_time,new_time)

          old_fulfillment='''<label class="field fulfillment-field"><span>Спосіб видачі</span><select name="fulfillment"><option value="pickup" ${v.fulfillment==='pickup'?'selected':''}>Самовивіз</option><option value="delivery" ${v.fulfillment==='delivery'?'selected':''}>Доставка · тариф за адресою</option></select></label>'''
          new_fulfillment='''<div class="admin-logistics-grid wide" data-admin-logistics><input type="hidden" name="fulfillment" value="${v.fulfillment}"><input type="hidden" name="deliveryOutboundMethod" value="${h(b?.extras?.delivery?.outbound_method||(v.fulfillment==='delivery'?'delivery':'pickup'))}"><input type="hidden" name="deliveryReturnMethod" value="${h(b?.extras?.delivery?.return_method||(v.fulfillment==='delivery'?'pickup':'return_to_location'))}"><article class="admin-logistics-card"><div><strong>На початку</strong><small>Передача клієнту</small></div><div class="admin-logistics-toggle"><button type="button" data-logistics-kind="outbound" data-logistics-value="pickup">Клієнт забирає</button><button type="button" data-logistics-kind="outbound" data-logistics-value="delivery">Доставляємо</button></div></article><article class="admin-logistics-card"><div><strong>Повернення</strong><small>Як техніка повертається</small></div><div class="admin-logistics-toggle"><button type="button" data-logistics-kind="return" data-logistics-value="return_to_location">Клієнт повертає</button><button type="button" data-logistics-kind="return" data-logistics-value="pickup">Забираємо</button></div></article><p class="admin-logistics-note" id="adminLogisticsNote"></p></div>'''
          must_replace(admin_path,old_fulfillment,new_fulfillment)

          old_delivery_decl='''const deliveryRouteLink=form.querySelector('#bookingDeliveryRoute'),deliveryPricingField=form.querySelector('.delivery-pricing-field'),deliveryAddressSummary=form.querySelector('#bookingDeliveryAddressSummary'),deliveryAmountInput=form.querySelector('[name="deliveryAmountOverride"]'),deliveryQuoteHint=form.querySelector('#bookingDeliveryQuoteHint');'''
          new_delivery_decl='''const deliveryRouteLink=form.querySelector('#bookingDeliveryRoute'),deliveryPricingField=form.querySelector('.delivery-pricing-field'),deliveryAddressSummary=form.querySelector('#bookingDeliveryAddressSummary'),deliveryAmountInput=form.querySelector('[name="deliveryAmountOverride"]'),deliveryQuoteHint=form.querySelector('#bookingDeliveryQuoteHint'),deliveryOutboundInput=form.querySelector('[name="deliveryOutboundMethod"]'),deliveryReturnInput=form.querySelector('[name="deliveryReturnMethod"]'),deliveryLogisticsNote=form.querySelector('#adminLogisticsNote');\nconst deliveryLegCount=()=>Number(deliveryOutboundInput?.value==='delivery')+Number(deliveryReturnInput?.value==='pickup');\nconst deliveryTripMultiplierForBooking=booking=>{const stored=Number(booking?.extras?.delivery?.trip_multiplier);if([0,2,4].includes(stored))return stored;const legs=Number(booking?.extras?.delivery?.legs);return legs===1?2:legs===0?0:4};\nconst syncLogisticsButtons=()=>{const legs=deliveryLegCount();form.fulfillment.value=legs?'delivery':'pickup';form.querySelectorAll('[data-logistics-kind]').forEach(btn=>{const active=btn.dataset.logisticsKind==='outbound'?btn.dataset.logisticsValue===deliveryOutboundInput?.value:btn.dataset.logisticsValue===deliveryReturnInput?.value;btn.classList.toggle('active',active);btn.setAttribute('aria-pressed',active?'true':'false')});if(deliveryLogisticsNote)deliveryLogisticsNote.textContent=legs===0?'Без доставки · клієнт сам забирає і повертає':legs===1?'1 напрямок VAcleaner · тариф доставки 50%':`2 напрямки VAcleaner · повний тариф доставки`};'''
          must_replace(admin_path,old_delivery_decl,new_delivery_decl)

          old_quote='''const syncAdminDeliveryQuote=({force=false}={})=>{if(!deliveryAmountInput)return;const delivery=form.fulfillment?.value==='delivery';if(!delivery)return;const meta=window.__VAC_ADMIN_DELIVERY_META__?.()||{},quote=adminDeliveryQuote(addressInput?.value||'',meta.verified===true,meta.routeKm);if(force||deliveryAmountInput.dataset.manual!=='1'){deliveryAmountInput.value=quote.quoteRequired?'':String(quote.amount||getDeliveryFee())}if(deliveryQuoteHint){const pricing=getDeliveryPricing();deliveryQuoteHint.textContent=quote.quoteRequired?`Тариф не розраховано автоматично${Number.isFinite(Number(quote.distanceKm))?` · ${Number(quote.distanceKm).toFixed(1).replace('.',',')} км за межами Полтави`:''}. Вкажіть узгоджену суму вручну до збереження.`:quote.zone==='route_zone'?`${quote.amount} грн · ${quote.distanceKm.toFixed(1).replace('.',',')} км маршрутом від бази · зона до ${quote.maxKm} км.`:quote.zone==='local'?`${pricing.local} грн · локальна зона${Number.isFinite(Number(meta.routeKm))&&Number(meta.routeKm)>0?` · ${Number(meta.routeKm).toFixed(1).replace('.',',')} км від бази`:''}.`:'Тариф визначиться після введення адреси.'}};\nconst syncFulfillmentUi=()=>{const delivery=form.fulfillment?.value==='delivery';if(deliveryPricingField){deliveryPricingField.hidden=!delivery;deliveryPricingField.setAttribute('aria-hidden',delivery?'false':'true')}if(addressInput){addressInput.disabled=false;addressInput.required=delivery}if(deliveryAmountInput)deliveryAmountInput.disabled=!delivery;syncDeliveryRoute();if(delivery)syncAdminDeliveryQuote()};\naddressInput?.addEventListener('input',()=>{syncDeliveryRoute();deliveryAmountInput?.removeAttribute('data-manual');syncAdminDeliveryQuote()});deliveryAmountInput?.addEventListener('input',()=>{deliveryAmountInput.dataset.manual='1'});document.addEventListener('vacleaner:address-selected',event=>{if(event.detail?.mode==='admin'){deliveryAmountInput?.removeAttribute('data-manual');syncAdminDeliveryQuote({force:true})}});form.fulfillment?.addEventListener('change',syncFulfillmentUi);syncFulfillmentUi();'''
          new_quote='''const syncAdminDeliveryQuote=({force=false}={})=>{if(!deliveryAmountInput)return;const legs=deliveryLegCount(),delivery=legs>0;if(!delivery)return;const meta=window.__VAC_ADMIN_DELIVERY_META__?.()||{},quote=adminDeliveryQuote(addressInput?.value||'',meta.verified===true,meta.routeKm),roundTrip=quote.quoteRequired?0:Number(quote.amount||getDeliveryFee()),adjusted=Math.round(roundTrip*legs/2);if(force||deliveryAmountInput.dataset.manual!=='1'){deliveryAmountInput.value=quote.quoteRequired?'':String(adjusted)}if(deliveryQuoteHint){const direction=legs===1?`1 напрямок із 2 · 50% від повного тарифу ${roundTrip} грн`:'доставка + забір · повний тариф';deliveryQuoteHint.textContent=quote.quoteRequired?`Тариф не розраховано автоматично${Number.isFinite(Number(quote.distanceKm))?` · ${Number(quote.distanceKm).toFixed(1).replace('.',',')} км за межами Полтави`:''}. Вкажіть узгоджену суму вручну до збереження.`:quote.zone==='route_zone'?`${adjusted} грн · ${direction} · ${quote.distanceKm.toFixed(1).replace('.',',')} км до клієнта.`:quote.zone==='local'?`${adjusted} грн · ${direction} · локальна зона.`:'Тариф визначиться після введення адреси.'}};\nconst syncFulfillmentUi=()=>{syncLogisticsButtons();const delivery=deliveryLegCount()>0;if(deliveryPricingField){deliveryPricingField.hidden=!delivery;deliveryPricingField.setAttribute('aria-hidden',delivery?'false':'true')}if(addressInput){addressInput.disabled=false;addressInput.required=delivery}if(deliveryAmountInput)deliveryAmountInput.disabled=!delivery;syncDeliveryRoute();if(delivery)syncAdminDeliveryQuote()};\nform.querySelectorAll('[data-logistics-kind]').forEach(btn=>btn.addEventListener('click',()=>{const target=btn.dataset.logisticsKind==='outbound'?deliveryOutboundInput:deliveryReturnInput;if(!target)return;target.value=btn.dataset.logisticsValue||'';deliveryAmountInput?.removeAttribute('data-manual');syncLogisticsButtons();form.fulfillment.dispatchEvent(new Event('change',{bubbles:true}))}));addressInput?.addEventListener('input',()=>{syncDeliveryRoute();deliveryAmountInput?.removeAttribute('data-manual');syncAdminDeliveryQuote()});deliveryAmountInput?.addEventListener('input',()=>{deliveryAmountInput.dataset.manual='1'});document.addEventListener('vacleaner:address-selected',event=>{if(event.detail?.mode==='admin'){deliveryAmountInput?.removeAttribute('data-manual');syncAdminDeliveryQuote({force:true})}});form.fulfillment?.addEventListener('change',syncFulfillmentUi);syncFulfillmentUi();'''
          must_replace(admin_path,old_quote,new_quote)

          old_pickup_sync='''form.querySelector('[data-time-picker="pickupTime"]')?.addEventListener('click',e=>{if(e.target.closest('[data-time]'))setTimeout(syncReturn,0)});'''
          new_pickup_sync='''form.querySelector('[name="pickupTime"]')?.addEventListener('change',()=>setTimeout(syncReturn,0));'''
          must_replace(admin_path,old_pickup_sync,new_pickup_sync)

          old_body='''customerAddress:deliveryParts.address,customerAddressDetail:deliveryParts.detail,fulfillment:fd.get('fulfillment'),deliveryAddress:deliveryParts.address'''
          new_body='''customerAddress:deliveryParts.address,customerAddressDetail:deliveryParts.detail,fulfillment:fd.get('fulfillment'),deliveryOutboundMethod:fd.get('deliveryOutboundMethod'),deliveryReturnMethod:fd.get('deliveryReturnMethod'),deliveryAddress:deliveryParts.address'''
          must_replace(admin_path,old_body,new_body)

          # Delivery operating-cost analytics must follow the actual one/two VAcleaner legs.
          old_sample='''function recentDeliverySample(limit=30,pricing=getDeliveryPricing()){\n  return state.bookings.filter(b=>b.status==='completed'&&b.fulfillment==='delivery').slice().sort((a,b)=>String(bookingCompletionDateIso(b)||'').localeCompare(String(bookingCompletionDateIso(a)||''))||String(b.completed_at||b.updated_at||'').localeCompare(String(a.completed_at||a.updated_at||''))).slice(0,Math.max(1,Number(limit)||30)).map(b=>{const meta=bookingDeliveryTypeMeta(b,pricing),deliveryMeta=b?.extras?.delivery&&typeof b.extras.delivery==='object'?b.extras.delivery:{},paid=Math.max(0,Number(b.delivery_amount)||Number(deliveryMeta.amount)||0),distanceSource=String(deliveryMeta.distance_source||deliveryMeta.distanceSource||'');return{booking:b,routeKm:Math.max(0,Number(meta.routeKm)||0),paid,priceKnown:paid>0,isLocal:meta.isLocal,distanceSource,routeNeedsRefresh:!meta.routeKm||['city','local','estimate','estimate_city','admin_backfill'].includes(distanceSource)}})\n}\nfunction fuelPriceForCar(car,fuel){return car?.fuelType==='lpg'?Number(fuel.lpgPerL)||0:Number(fuel.petrolPerL)||0}\nfunction sampleFuelCost(row,car,pricing=getDeliveryPricing()){const fuel=pricing.fuel||DEFAULT_DELIVERY_PRICING.fuel,consumption=row?.isLocal?Number(car?.consumptionL100)||0:Number(fuel.consumptionL100)||0;return deliveryFuelCost(Math.max(0,Number(row?.routeKm)||0),fuelPriceForCar(car,fuel),consumption,4)}\nfunction bookingEstimatedFuelProfiles(b,pricing=getDeliveryPricing()){\n  if(b.fulfillment!=='delivery'||bookingRouteNeedsRefresh(b))return[];\n  const meta=bookingDeliveryTypeMeta(b,pricing),routeKm=Math.max(0,Number(meta.routeKm)||0),fuel=pricing.fuel||DEFAULT_DELIVERY_PRICING.fuel;\n  if(!routeKm)return[];\n  if(meta.isLocal)return(fuel.cityCars||DEFAULT_CITY_CARS).map(car=>({label:car.label,fuelType:car.fuelType==='lpg'?'lpg':'petrol',cost:deliveryFuelCost(routeKm,fuelPriceForCar(car,fuel),car.consumptionL100,4),consumptionL100:Number(car.consumptionL100)||0,kind:'local'}));\n  return[{label:'Маршрут',cost:deliveryFuelCost(routeKm,fuel.petrolPerL,fuel.consumptionL100,4),consumptionL100:Number(fuel.consumptionL100)||0,kind:'route'}]\n}'''
          new_sample='''function recentDeliverySample(limit=30,pricing=getDeliveryPricing()){\n  return state.bookings.filter(b=>b.status==='completed'&&b.fulfillment==='delivery').slice().sort((a,b)=>String(bookingCompletionDateIso(b)||'').localeCompare(String(bookingCompletionDateIso(a)||''))||String(b.completed_at||b.updated_at||'').localeCompare(String(a.completed_at||a.updated_at||''))).slice(0,Math.max(1,Number(limit)||30)).map(b=>{const meta=bookingDeliveryTypeMeta(b,pricing),deliveryMeta=b?.extras?.delivery&&typeof b.extras.delivery==='object'?b.extras.delivery:{},paid=Math.max(0,Number(b.delivery_amount)||Number(deliveryMeta.amount)||0),distanceSource=String(deliveryMeta.distance_source||deliveryMeta.distanceSource||''),tripMultiplier=deliveryTripMultiplierForBooking(b);return{booking:b,routeKm:Math.max(0,Number(meta.routeKm)||0),paid,priceKnown:paid>0,isLocal:meta.isLocal,distanceSource,tripMultiplier,routeNeedsRefresh:!meta.routeKm||['city','local','estimate','estimate_city','admin_backfill'].includes(distanceSource)}})\n}\nfunction fuelPriceForCar(car,fuel){return car?.fuelType==='lpg'?Number(fuel.lpgPerL)||0:Number(fuel.petrolPerL)||0}\nfunction sampleFuelCost(row,car,pricing=getDeliveryPricing()){const fuel=pricing.fuel||DEFAULT_DELIVERY_PRICING.fuel,consumption=row?.isLocal?Number(car?.consumptionL100)||0:Number(fuel.consumptionL100)||0;return deliveryFuelCost(Math.max(0,Number(row?.routeKm)||0),fuelPriceForCar(car,fuel),consumption,Number(row?.tripMultiplier)||4)}\nfunction bookingEstimatedFuelProfiles(b,pricing=getDeliveryPricing()){\n  if(b.fulfillment!=='delivery'||bookingRouteNeedsRefresh(b))return[];\n  const meta=bookingDeliveryTypeMeta(b,pricing),routeKm=Math.max(0,Number(meta.routeKm)||0),fuel=pricing.fuel||DEFAULT_DELIVERY_PRICING.fuel,tripMultiplier=deliveryTripMultiplierForBooking(b);\n  if(!routeKm)return[];\n  if(meta.isLocal)return(fuel.cityCars||DEFAULT_CITY_CARS).map(car=>({label:car.label,fuelType:car.fuelType==='lpg'?'lpg':'petrol',cost:deliveryFuelCost(routeKm,fuelPriceForCar(car,fuel),car.consumptionL100,tripMultiplier),consumptionL100:Number(car.consumptionL100)||0,kind:'local'}));\n  return[{label:'Маршрут',cost:deliveryFuelCost(routeKm,fuel.petrolPerL,fuel.consumptionL100,tripMultiplier),consumptionL100:Number(fuel.consumptionL100)||0,kind:'route'}]\n}'''
          must_replace(admin_path,old_sample,new_sample)
          old_trip="const routeKm=bookingRouteNeedsRefresh(b)?null:Math.max(0,bookingRouteKm(b)||0)||null,fullTripKm=routeKm===null?null:routeKm*4;"
          new_trip="const routeKm=bookingRouteNeedsRefresh(b)?null:Math.max(0,bookingRouteKm(b)||0)||null,fullTripKm=routeKm===null?null:routeKm*deliveryTripMultiplierForBooking(b);"
          must_replace(admin_path,old_trip,new_trip)

          css_path=root/'assets/admin-v250.css'
          css=css_path.read_text(encoding='utf-8')
          css+='''\n\n/* v4.3.12 — admin-only exact time + two-leg logistics */\n#bookingForm .rental-moment .window-choice[hidden]{display:none!important}\n#bookingForm .admin-exact-time-picker{display:grid;gap:6px;margin-top:8px}\n#bookingForm .admin-exact-time-picker input[type="time"]{width:100%;min-height:46px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:rgba(255,255,255,.055);color:inherit;padding:0 12px;font:inherit;font-weight:700}\n#bookingForm .admin-time-tariff-hint{font-size:12px;line-height:1.35;color:var(--muted,#9ca5ad)}\n#bookingForm .admin-logistics-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}\n#bookingForm .admin-logistics-card{min-width:0;border:1px solid rgba(255,255,255,.11);border-radius:14px;padding:12px;background:rgba(255,255,255,.035);display:grid;gap:10px}\n#bookingForm .admin-logistics-card>div:first-child{display:grid;gap:2px}\n#bookingForm .admin-logistics-card strong{font-size:14px}\n#bookingForm .admin-logistics-card small,#bookingForm .admin-logistics-note{font-size:12px;color:var(--muted,#9ca5ad)}\n#bookingForm .admin-logistics-toggle{display:grid;grid-template-columns:1fr 1fr;gap:6px}\n#bookingForm .admin-logistics-toggle button{min-width:0;min-height:42px;border-radius:11px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.045);color:inherit;padding:8px 9px;font:inherit;font-size:12px;font-weight:750;line-height:1.15}\n#bookingForm .admin-logistics-toggle button.active{border-color:rgba(224,190,120,.72);background:rgba(224,190,120,.13);box-shadow:inset 0 0 0 1px rgba(224,190,120,.16)}\n#bookingForm .admin-logistics-note{grid-column:1/-1;margin:0;padding:0 2px}\n@media(max-width:680px){#bookingForm .admin-logistics-grid{grid-template-columns:1fr}#bookingForm .admin-logistics-note{grid-column:auto}}\n'''
          css_path.write_text(css,encoding='utf-8')

          edge_path=Path('supabase/functions/vacleaner-admin-bookings-v4/index.ts')
          must_replace(edge_path,
              'const validTime = (value: unknown) => typeof value === "string" && /^\\d{2}:\\d{2}$/.test(value);',
              'const validTime = (value: unknown) => typeof value === "string" && /^(?:[01]\\d|2[0-3]):[0-5]\\d$/.test(value);')
          old_period='''function periodFromBody(body: Record<string, any>, slots: SlotConfig) {\n  const startDate = dateValue(body.startDate), returnDate = dateValue(body.returnDate);\n  const pickupWindow = body.pickupWindow === "evening" ? "evening" : "morning";\n  const returnWindow = body.returnWindow === "evening" ? "evening" : "morning";\n  const pickupTime = String(body.pickupTime || (pickupWindow === "morning" ? slots.morningStart : slots.eveningStart));\n  const returnTime = String(body.returnTime || (returnWindow === "morning" ? slots.morningEnd : slots.eveningEnd));\n  if (!startDate || !returnDate) throw new Error("invalid_dates");\n  if (!validTime(pickupTime) || !validTime(returnTime) || !inWindow(pickupTime, pickupWindow, slots) || !inWindow(returnTime, returnWindow, slots)) throw new Error("invalid_exact_time");\n  const days = rentalDays(startDate, returnDate, pickupWindow, returnWindow);\n  if (days < 1 || days > 14) throw new Error("invalid_rental_period");\n  return { startDate, returnDate, pickupWindow, returnWindow, pickupTime, returnTime, days };\n}'''
          new_period='''function periodFromBody(body: Record<string, any>, slots: SlotConfig) {\n  const startDate = dateValue(body.startDate), returnDate = dateValue(body.returnDate);\n  const requestedPickupWindow = body.pickupWindow === "evening" ? "evening" : "morning";\n  const requestedReturnWindow = body.returnWindow === "evening" ? "evening" : "morning";\n  const pickupTime = String(body.pickupTime || (requestedPickupWindow === "morning" ? slots.morningStart : slots.eveningStart));\n  const returnTime = String(body.returnTime || (requestedReturnWindow === "morning" ? slots.morningEnd : slots.eveningEnd));\n  if (!startDate || !returnDate) throw new Error("invalid_dates");\n  if (!validTime(pickupTime) || !validTime(returnTime)) throw new Error("invalid_exact_time");\n  // Admin may use any exact clock time. The existing tariff/inventory half-day model remains\n  // canonical: 17:30+ is the evening moment; anything earlier is the morning moment.\n  const pickupWindow: WindowCode = pickupTime >= slots.eveningStart ? "evening" : "morning";\n  const returnWindow: WindowCode = returnTime >= slots.eveningStart ? "evening" : "morning";\n  const days = rentalDays(startDate, returnDate, pickupWindow, returnWindow);\n  if (days < 1 || days > 14) throw new Error("invalid_rental_period");\n  return { startDate, returnDate, pickupWindow, returnWindow, pickupTime, returnTime, days };\n}'''
          must_replace(edge_path,old_period,new_period)

          old_customer='''const customerName = cleanText(body.customerName, 120), customerPhone = normalizePhone(body.customerPhone), fulfillment = body.fulfillment === "delivery" ? "delivery" : "pickup";\n      const address = fulfillment === "delivery" ? cleanText(body.deliveryAddress, 220) : "Полтава, вул. Європейська, 146Е", addressDetail = fulfillment === "delivery" ? cleanText(body.deliveryAddressDetail, 180) : "";'''

="field delivery-pricing-field wide"><span>Доставка за адресою клієнта</span><div class="delivery-quote-editor"><span>Тариф доставки</span><div><input value="125"><em>грн</em></div><small>125 грн · 1 напрямок із 2 · 50% від повного тарифу 250 грн · локальна зона.</small></div></div></div></section></form>'''

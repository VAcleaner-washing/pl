name: R4 generated UI layout
on:
  push:
    branches: ['qa/admin-r4-mobile-layout*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r4-layout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  layout:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.61.0-noble@sha256:a9731514f24121d1dcd25d58d0a38146646d290a5998fd80d3e533e7b5e21c69
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        width: [320, 390, 440, 768, 1440, session]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 15bf61dc4da4cf63405a25887353e6ec7178dce8
          path: stable-reference-test-results/source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the Python client for the pinned official browser image
        timeout-minutes: 15
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.txt
          python -m playwright --version
      - name: Build immutable 46 reference
        working-directory: stable-reference-test-results/source
        run: node scripts/build-pages.mjs
      - name: Build actual generated staging artifact
        run: |
          npm run build
          npm run build:staging-ui
      - name: Check R4 after login without external network
        env:
          DEBUG: pw:browser
          LAYOUT_WIDTH: ${{ matrix.width }}
        run: |
          if [ "$LAYOUT_WIDTH" = session ]; then
            python scripts/admin_staging_layout_qa.py --browser ${{ matrix.browser }} --artifacts staging-ui-test-results/${{ matrix.browser }}-${{ matrix.width }}
          else
            python scripts/admin_staging_layout_qa.py --browser ${{ matrix.browser }} --width "$LAYOUT_WIDTH" --artifacts staging-ui-test-results/${{ matrix.browser }}-${{ matrix.width }}
          fi
      - name: Preserve screenshots and geometry on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4-layout-${{ matrix.browser }}-${{ matrix.width }}
          path: staging-ui-test-results/${{ matrix.browser }}-${{ matrix.width }}
          retention-days: 14

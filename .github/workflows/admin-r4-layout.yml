name: R4 generated UI layout
on:
  push:
    branches: ['qa/admin-r4-mobile-layout']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r4-layout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  layout:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-r4-${{ matrix.browser }}-${{ hashFiles('requirements-ci.txt') }}
      - name: Install pinned browser dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.txt
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Build actual generated staging artifact
        run: |
          npm run build
          npm run build:staging-ui
      - name: Check R4 after login without external network
        env:
          DEBUG: pw:browser
        run: python scripts/admin_staging_layout_qa.py --browser ${{ matrix.browser }} --artifacts staging-ui-test-results/${{ matrix.browser }}
      - name: Preserve screenshots and geometry on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4-layout-${{ matrix.browser }}
          path: staging-ui-test-results/${{ matrix.browser }}
          retention-days: 14

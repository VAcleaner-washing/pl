name: Immutable R61 WebKit version diagnostic
on:
  push:
    branches: ['audit/r61-webkit-version']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r61-webkit-version-${{ github.ref }}
  cancel-in-progress: false
env:
  IMMUTABLE_PRODUCT: c1f59213bb90c8185414ded45fe846108d5d04bb
jobs:
  inputs:
    name: Build immutable c1 R4 and LAB inputs once
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c1f59213bb90c8185414ded45fe846108d5d04bb
          path: product
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build unchanged product artifacts
        working-directory: product
        run: |
          test "$(git rev-parse HEAD)" = "$IMMUTABLE_PRODUCT"
          npm run build
          npm run build:staging-ui
          npm run build:lab
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          roots=['staging-ui-test-results/dist','lab-test-results/dist']
          files={str(p):hashlib.sha256(p.read_bytes()).hexdigest()
                 for root in roots for p in sorted(Path(root).rglob('*')) if p.is_file()}
          assert files
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['IMMUTABLE_PRODUCT']
          manifest={'source':os.environ['IMMUTABLE_PRODUCT'],'roots':roots,'files':files}
          Path('webkit-diagnostic-build.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps({'source':manifest['source'],'files':len(files),'manifestSha256':hashlib.sha256(Path('webkit-diagnostic-build.json').read_bytes()).hexdigest()}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: immutable-c1-webkit-inputs
          path: |
            product/staging-ui-test-results/dist
            product/lab-test-results/dist
            product/webkit-diagnostic-build.json
          include-hidden-files: true
          retention-days: 14
  compare:
    name: WebKit ${{ matrix.runtime.client }} / declared sample ${{ matrix.sample }}
    needs: inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: ${{ matrix.runtime.image }}
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
        runtime:
          - client: '1.60.0'
            image: mcr.microsoft.com/playwright/python:v1.60.0-noble@sha256:8ff591d613b01c884cc488339ed4318b4513eaf0c57a164a878ba49e70e3f384
          - client: '1.61.0'
            image: mcr.microsoft.com/playwright/python:v1.61.0-noble@sha256:a9731514f24121d1dcd25d58d0a38146646d290a5998fd80d3e533e7b5e21c69
    steps:
      - uses: actions/checkout@v4
        with:
          path: diagnostic-source
      - uses: actions/checkout@v4
        with:
          ref: c1f59213bb90c8185414ded45fe846108d5d04bb
          path: product
      - uses: actions/download-artifact@v4
        with:
          name: immutable-c1-webkit-inputs
          path: product
      - name: Require identical generated bytes and unmodified harnesses
        working-directory: product
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          m=json.loads(Path('webkit-diagnostic-build.json').read_text())
          assert m['source']==os.environ['IMMUTABLE_PRODUCT']
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==m['source']
          files={str(p):hashlib.sha256(p.read_bytes()).hexdigest()
                 for root in m['roots'] for p in sorted(Path(root).rglob('*')) if p.is_file()}
          assert files==m['files'],'Generated artifact differs from immutable shared input'
          assert subprocess.run(['git','diff','--exit-code','--','assets','sandbox','staging','scripts/admin_staging_screens_qa.py','scripts/admin_lab_qa.py']).returncode==0
          print(json.dumps({'source':m['source'],'files':len(files),'identical':True}))
          PY
      - name: Install only the matching immutable browser client
        env:
          PW_CLIENT_VERSION: ${{ matrix.runtime.client }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          v=os.environ['PW_CLIENT_VERSION']
          assert v in ['1.60.0','1.61.0']
          Path('/tmp/r61-playwright-requirements.txt').write_text('playwright=='+v+'\n')
          PY
          python -m pip install --disable-pip-version-check -r /tmp/r61-playwright-requirements.txt
      - name: Run both unchanged full suites and retain each outcome
        env:
          DEBUG: pw:browser
          PYTHONUNBUFFERED: '1'
          PW_CLIENT_VERSION: ${{ matrix.runtime.client }}
          DECLARED_SAMPLE: ${{ matrix.sample }}
        run: python diagnostic-source/scripts/admin_webkit_version_probe.py --root product --artifacts webkit-version-results/${{ matrix.runtime.client }}-${{ matrix.sample }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r61-webkit-${{ matrix.runtime.client }}-sample-${{ matrix.sample }}
          path: webkit-version-results/${{ matrix.runtime.client }}-${{ matrix.sample }}
          retention-days: 14

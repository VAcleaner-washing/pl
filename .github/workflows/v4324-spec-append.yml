name: v4324-spec-append
on:
  push:
    branches:
      - qa/v4.3.24-desktop-booking-polish
    paths:
      - .github/workflows/v4324-spec-append.yml

permissions:
  contents: write

jobs:
  append-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v4.3.24-desktop-booking-polish
      - name: Append spec
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('docs/VAcleaner-SYSTEM-SPEC.md')
          text=path.read_text(encoding='utf-8')
          marker='# 80. Change record — v4.3.24 DESKTOP BOOKING POLISH'
          record="\n\n# 80. Change record — v4.3.24 DESKTOP BOOKING POLISH\n\n### ADDED\n\n- `assets/admin-v4324.css` adds a presentation-only desktop polish layer for the booking status toolbar.\n- `scripts/test-v4-3-24-desktop-booking-polish.mjs` and `scripts/admin_booking_v4324_desktop_polish_qa.py` lock the desktop treatment and sticky-header safety.\n\n### CHANGED\n\n- Desktop booking filters keep all eight canonical statuses and the same `data-filter` behavior, but use calmer compact chips with inline counts instead of circular count badges.\n- The active filter uses a restrained gold tint rather than the heavy filled treatment.\n- The desktop sticky filter rail keeps an 8 px safe inset inside the scroll pane so it cannot tuck under the fixed top bar.\n- The booking content pane keeps a small top safety offset and scroll padding so the operational cards begin cleanly below the fixed header boundary.\n\n### FIXED\n\n- Removed the visually noisy desktop count bubbles and oversized active filter treatment.\n- Prevented the sticky booking filter rail from occupying the negative top offset used by the older desktop density layer.\n\n### PRESERVED\n\n- Filter labels, counts, `data-filter` values, click handlers, booking status semantics and list filtering remain unchanged.\n- Operations-card actions and metrics remain unchanged.\n- Mobile/PWA v4.3.23 filter treatment remains unchanged.\n- Booking finance, pricing, deposits, prepayment, delivery, Supabase, RETURN/SMS/referral, availability and VA HOME are unchanged.\n- Canonical package/build baseline remains `4.3.0 / 4300`.\n\n### TESTS\n\n- Static gate verifies desktop scoping, load order, service-worker cache inclusion, inline counts and untouched filter semantics.\n- Browser gate verifies 1024 / 1280 / 1440 / 1648 px: all eight filters visible, no horizontal overflow, lightweight counts, restrained active state, operations row below the desktop scroll boundary and sticky rail below the fixed top bar.\n- Full canonical Static/build + Browser/PWA QA remains release-blocking before merge to `main`.\n"
          if marker not in text:
              path.write_text(text.rstrip()+record+'\n',encoding='utf-8')
          PY
          rm .github/workflows/v4324-spec-append.yml
          git config user.name "VAcleaner CI"
          git config user.email "actions@users.noreply.github.com"
          git add docs/VAcleaner-SYSTEM-SPEC.md .github/workflows/v4324-spec-append.yml
          git commit -m "v4.3.24: document desktop booking polish"
          git push origin HEAD:qa/v4.3.24-desktop-booking-polish

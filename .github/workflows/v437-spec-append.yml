name: v4.3.7 Append System Spec

on:
  push:
    branches:
      - qa/v4.3.7-booking-finance-dedup

permissions:
  contents: write

jobs:
  append-spec:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v4.3.7-booking-finance-dedup
          fetch-depth: 0
      - name: Append v4.3.7 source-of-truth record
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/VAcleaner-SYSTEM-SPEC.md')
          text=p.read_text(encoding='utf-8').rstrip()
          marker='# 65. Change record — v4.3.7 BOOKING FINANCE DEDUP'
          if marker not in text:
              text += '''\n\n\n# 65. Change record — v4.3.7 BOOKING FINANCE DEDUP\n\n### ADDED\n\n- `assets/admin-v437.js` and `assets/admin-v437.css` add a narrow presentation-only booking-card finance layer.\n- `scripts/test-v4-3-7-booking-finance-dedup.mjs` and `scripts/finance_card_v437_visual_qa.py` guard exact normal/exception deposit states at 390 px and 1440 px.\n\n### CHANGED\n\n- Booking-card `Отримано` is the single primary received-money row.\n- When deposit is normal/paid, its composition moves to subordinate helper copy under `Отримано`: `Передоплата … · залог …`.\n- A pending deposit before issue is expected and appears only in helper copy as `залог … при видачі`.\n- A separate deposit row is reserved for exceptional post-issue state where deposit is missing.\n\n### FIXED\n\n- Paid deposit no longer repeats `Отримано` as a second `Залоговий платіж … · отримано` row.\n- The card no longer presents one fact (`received includes deposit`) as two competing successful states.\n- Post-issue missing deposit remains explicit as `Залог не отримано` / `потрібна перевірка`.\n\n### PRESERVED\n\n- `f.received`, prepayment, securityDeposit, refund/due, expenses, delivery, extras, chemistry, discounts, persistence and booking status logic are unchanged.\n- Detailed breakdown in `Розрахунок` is unchanged.\n- Supabase, SMS/RETURN/referral, availability, service worker, public booking and VA HOME are unchanged.\n\n### TESTS\n\n- `scripts/test-v4-3-7-booking-finance-dedup.mjs` via canonical `test:pwa-static`.\n- `scripts/finance_card_v437_visual_qa.py` chained into the canonical finance-flow browser gate at 390 px and 1440 px.\n- Full canonical static/build/browser/PWA QA remains release-blocking before merge.\n'''
              p.write_text(text+'\n',encoding='utf-8')
          PY
      - name: Commit source-of-truth update
        shell: bash
        run: |
          if git diff --quiet -- docs/VAcleaner-SYSTEM-SPEC.md; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/VAcleaner-SYSTEM-SPEC.md
          git commit -m 'docs: record v4.3.7 booking finance dedup'
          git push origin HEAD:qa/v4.3.7-booking-finance-dedup

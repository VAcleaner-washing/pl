name: v4.3.16 System Spec append

on:
  push:
    branches:
      - qa/v4.3.16-admin-time-range
    paths:
      - .github/workflows/v4316-spec-append.yml

permissions:
  contents: write

jobs:
  append-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v4.3.16-admin-time-range
          fetch-depth: 0
      - name: Append approved v4.3.16 contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/VAcleaner-SYSTEM-SPEC.md')
          text = path.read_text(encoding='utf-8')
          marker = '## Admin exact-time range — v4.3.16'
          if marker not in text:
              text += '''\n\n## Admin exact-time range — v4.3.16\n\n### ADDED\n- Admin exact-time bottom sheet exposes selectable times only from **07:00 through 21:00 inclusive**.\n\n### CHANGED\n- The existing 30-minute grid is constrained to the operational daytime window: `07:00, 07:30, ... 20:30, 21:00`.\n- Previously saved exact times outside 07:00–21:00 remain visible as a legacy current value when editing, but are not offered as new selectable slots.\n\n### FIXED\n- Removes unnecessary overnight choices (`00:00–06:30` and `21:30–23:30`) from the admin/PWA picker.\n\n### PRESERVED\n- 30-minute step, canonical `pickupTime` / `returnTime` events, tariff mapping, public booking slots and v4.3.12 two-leg logistics remain unchanged.\n\n### TESTS\n- `scripts/test-v4-3-16-admin-time-range.mjs`\n- `scripts/admin_booking_v4316_time_range_qa.py` at 390 / 430 px.\n'''
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit System Spec update
        shell: bash
        run: |
          if git diff --quiet -- docs/VAcleaner-SYSTEM-SPEC.md; then
            echo 'Spec already up to date.'
            exit 0
          fi
          git config user.name 'VAcleaner Release QA'
          git config user.email 'vacleaner.washing@gmail.com'
          git add docs/VAcleaner-SYSTEM-SPEC.md
          git commit -m 'docs(v4.3.16): define 07:00–21:00 admin time range'
          git push origin HEAD:qa/v4.3.16-admin-time-range

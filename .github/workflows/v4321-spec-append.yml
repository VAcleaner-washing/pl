name: v4.3.21 System Spec append

on:
  push:
    branches:
      - qa/v4.3.21-detail-finance-redesign

permissions:
  contents: write

jobs:
  append-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v4.3.21-detail-finance-redesign
          fetch-depth: 0
      - name: Append System Spec and remove helper
        run: node scripts/append-v4321-spec.mjs
      - name: Commit normative record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No System Spec change needed"
          else
            git commit -m "docs: record v4.3.21 detail finance redesign"
            git push origin HEAD:qa/v4.3.21-detail-finance-redesign
          fi

name: Deploy VAcleaner Pages
on:
  push:
    branches:
      - main
      - 'qa/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static / build gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append v4.3.20 System Spec record
        if: github.event_name == 'push' && github.ref == 'refs/heads/qa/v4.3.20-upcoming-status'
        run: |
          if ! grep -q '^# 76. Change record — v4.3.20 UPCOMING STATUS ALIGNMENT$' docs/VAcleaner-SYSTEM-SPEC.md; then
            cat >> docs/VAcleaner-SYSTEM-SPEC.md <<'EOF'


---

# 76. Change record — v4.3.20 UPCOMING STATUS ALIGNMENT

## UPCOMING-STATUS-001 — mobile status badge stays in the header

На mobile/PWA картка `Найближчі` тримає статус бронювання у верхньому правому куті заголовка незалежно від довжини назви техніки. Назва техніки займає ліву гнучку колонку й може переноситися, але не має права виштовхувати `Підтверджена` / інший status chip на окремий рядок під назву.

### CHANGED

- Заголовок mobile `Найближчі` використовує дві колонки: `minmax(0,1fr)` для назви техніки та `max-content` для status chip.
- Довгі назви на кшталт `Puzzi + Jimmy + робот` можуть переноситися тільки всередині лівої колонки.

### FIXED

- `Підтверджена` більше не падає під назву техніки у довгій картці й лишається вирівняною праворуч зверху, як у коротких бронюваннях.

### PRESERVED

- Дані бронювання, статусна машина, час, extras, клієнт, телефон, доставка, кнопки `Деталі` / `Видати техніку`, фінанси, Supabase, RETURN/SMS/referral, public booking та VA HOME не змінюються.
- Desktop/tablet layout поза mobile breakpoint не змінюється.

### TESTS

- `scripts/test-v4-3-20-upcoming-status.mjs` — static contract для двоколонкового title/status layout і PWA asset/cache.
- `scripts/admin_upcoming_status_v4320_qa.py` — browser regression на 390 / 430 px із довгою назвою `Puzzi + Jimmy + робот`.
- Full canonical Static/build + Browser/PWA QA залишається release-blocking перед merge у `main`.
EOF
            git config user.name "VAcleaner QA"
            git config user.email "vacleaner.washing@gmail.com"
            git add docs/VAcleaner-SYSTEM-SPEC.md
            git commit -m "docs(v4.3.20): record Upcoming status alignment"
            git push origin HEAD:qa/v4.3.20-upcoming-status
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Run canonical static / regression QA
        run: npm run qa:static
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: dist

  browser:
    name: Browser QA aggregate gate
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements-ci.txt') }}
      - name: Install Playwright browser tests
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.txt
          python -m playwright install --with-deps chromium
      - name: Download validated Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: .pages-artifact
      - name: Extract validated Pages artifact
        run: |
          test ! -e dist
          mkdir dist
          tar -xf .pages-artifact/artifact.tar -C dist
      - name: Run canonical browser / PWA QA
        run: npm run qa:browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vacleaner-browser-test-results
          path: |
            qa-release-summary.json
            test-results
            pwa-test-results
            density-test-results
            final-desktop-test-results
            home-density-test-results
            equipment-density-test-results
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [validate, browser]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

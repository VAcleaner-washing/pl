name: Diagnose VAcleaner WebKit runtime without deployment
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: diagnostic-webkit-4364
  cancel-in-progress: false
jobs:
  compare:
    if: github.ref == 'refs/heads/diagnostics/webkit-4364-runtime'
    name: WebKit ${{ matrix.runtime.version }} / ${{ matrix.application.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - version: '1.61.0'
            image: mcr.microsoft.com/playwright/python:v1.61.0-noble@sha256:a9731514f24121d1dcd25d58d0a38146646d290a5998fd80d3e533e7b5e21c69
          - version: '1.65.1'
            image: mcr.microsoft.com/playwright/python:v1.65.1-noble@sha256:0ab41a37431309d72b7a26f40ef1fdb464a62740196b2143965a2f59dc090409
        application:
          - label: current64
            ref: 8fc7260f0587eae11874bef2d863647d514bacba
          - label: baseline63
            ref: e76f8a133032eb09ac739d12b49711729101e0a7
    container:
      image: ${{ matrix.runtime.image }}
      options: --ipc=host
    env:
      DEBUG: pw:browser
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.application.ref }}
          path: app-reference
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install matching official browser client
        run: |
          python -m pip install --disable-pip-version-check playwright==${{ matrix.runtime.version }}
          python -m playwright --version
      - name: Preserve identical assertions and build isolated LAB fixture
        id: build
        run: |
          cp scripts/admin_lab_qa.py scripts/public_hydration_qa.py scripts/e2e_smoke.py scripts/admin_idle_qa.py scripts/admin_entrypoint_finance_qa.py app-reference/scripts/
          cd app-reference
          node scripts/build-pages.mjs
          node scripts/build-admin-lab.mjs
          mkdir -p diagnostic-results/public1 diagnostic-results/lab1 diagnostic-results/public2 diagnostic-results/lab2
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          names=['admin_lab_qa.py','public_hydration_qa.py','e2e_smoke.py','admin_idle_qa.py','admin_entrypoint_finance_qa.py']
          evidence={'runtime':'${{ matrix.runtime.version }}','application':'${{ matrix.application.label }}','applicationRef':'${{ matrix.application.ref }}','testDriver':os.environ['GITHUB_SHA'],'testHashes':{n:hashlib.sha256((Path('scripts')/n).read_bytes()).hexdigest() for n in names},'assertionsRelaxed':False,'browserFlagsChanged':False}
          Path('diagnostic-results/identity.json').write_text(json.dumps(evidence,indent=2)+'\n')
          PY
      - name: Public hydration trial1
        id: public1
        continue-on-error: true
        working-directory: app-reference
        shell: bash
        run: python -u scripts/public_hydration_qa.py --browser webkit --root dist --artifacts diagnostic-results/public1 2>&1 | tee diagnostic-results/public1/run.log
      - name: LAB lifecycle trial1
        id: lab1
        continue-on-error: true
        working-directory: app-reference
        shell: bash
        run: python -u scripts/admin_lab_qa.py --browser webkit --artifacts diagnostic-results/lab1 2>&1 | tee diagnostic-results/lab1/run.log
      - name: Public hydration trial2
        id: public2
        continue-on-error: true
        working-directory: app-reference
        shell: bash
        run: python -u scripts/public_hydration_qa.py --browser webkit --root dist --artifacts diagnostic-results/public2 2>&1 | tee diagnostic-results/public2/run.log
      - name: LAB lifecycle trial2
        id: lab2
        continue-on-error: true
        working-directory: app-reference
        shell: bash
        run: python -u scripts/admin_lab_qa.py --browser webkit --artifacts diagnostic-results/lab2 2>&1 | tee diagnostic-results/lab2/run.log
      - name: Record every outcome without treating a later pass as a retry
        if: always()
        env:
          PUBLIC1: ${{ steps.public1.outcome }}
          LAB1: ${{ steps.lab1.outcome }}
          PUBLIC2: ${{ steps.public2.outcome }}
          LAB2: ${{ steps.lab2.outcome }}
        run: |
          python - <<'PY'
          import json,os,shutil
          from pathlib import Path
          root=Path('app-reference/diagnostic-results');out=Path('diagnostics-summary');out.mkdir(exist_ok=True)
          for p in root.rglob('*'):
              if p.is_file() and (p.suffix in ['.json','.log'] or 'failure' in p.name):
                  target=out/p.relative_to(root);target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,target)
                  if p.name.endswith('-navigation-failure.json'):
                      trace=p.with_name(p.name.replace('-navigation-failure.json','-trace.zip'))
                      if trace.exists():shutil.copyfile(trace,target.with_name(trace.name))
          outcomes={k:os.environ[k] for k in ['PUBLIC1','LAB1','PUBLIC2','LAB2']}
          result={'runtime':'${{ matrix.runtime.version }}','application':'${{ matrix.application.label }}','outcomes':outcomes,'allOriginalChecksPassed':all(v=='success' for v in outcomes.values()),'purpose':'Controlled diagnostic; no deploy, retries, ignored assertions or application changes'}
          (out/'comparison.json').write_text(json.dumps(result,indent=2)+'\n');print(json.dumps(result))
          raise SystemExit(0 if result['allOriginalChecksPassed'] else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-compare-${{ matrix.runtime.version }}-${{ matrix.application.label }}
          path: diagnostics-summary
          if-no-files-found: error
          retention-days: 14

name: Deploy VAcleaner Pages
on:
  push:
    branches:
      - main
      - 'qa/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  # Preserve a running acceptance result when a diagnostic follow-up is pushed.
  cancel-in-progress: false

jobs:
  classify:
    name: PR change classification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.files.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify docs-only classification fixtures
        run: |
          node scripts/test-classify-pr-changes.mjs
          node scripts/test-selective-pr-ci.mjs
          node scripts/test-merge-readiness.mjs
      - name: Classify complete PR file list (fail closed)
        id: files
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/ci-classify-pr.mjs

  validate:
    name: Static / build gate
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Run canonical static / regression QA
        run: npm run qa:static
      - name: Verify CI diagnostic fixtures and inspect suite inventory
        run: |
          node scripts/test-ci-diagnostics.mjs
          node scripts/ci-diagnostics.mjs
          node scripts/test-qa-timing-report.mjs
          node scripts/test-pwa-worker-monitor.mjs
      - name: Report measured static QA bottlenecks
        if: always()
        run: |
          if test -f qa-release-summary.json; then node scripts/qa-timing-report.mjs; fi
      - name: Build and verify the reviewed normal production artifact
        run: |
          npm run test:release-candidate
          npm run verify:production-artifact
          npm run test:production-promotion
      - name: Upload static QA summary on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vacleaner-static-qa-failure
          path: qa-release-summary.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload canonical regression artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: dist
      - name: Upload reviewed production Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: production-pages
          path: release-candidate-test-results/dist
      - name: Upload production artifact provenance
        uses: actions/upload-artifact@v4
        with:
          name: vacleaner-production-artifact-provenance
          path: |
            release-candidate-test-results/manifest.json
            config/admin-production-release.json
          if-no-files-found: error
          retention-days: 14

  engines:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    needs: [classify, validate]
    if: needs.classify.outputs.docs_only != 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - lane: canonical
            name: Browser QA aggregate gate
          - lane: webkit
            name: WebKit / mobile forms gate
    container:
      image: mcr.microsoft.com/playwright/python:v1.65.1-noble@sha256:0ab41a37431309d72b7a26f40ef1fdb464a62740196b2143965a2f59dc090409
      options: --ipc=host
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        id: checkout
      - uses: actions/setup-node@v4
        id: setup_node
        with:
          node-version: 22
      - name: Install client for the pinned official browser runtime
        id: canonical_client
        if: matrix.lane == 'canonical'
        timeout-minutes: 5
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Verify browser runtime failure contracts
        id: canonical_contracts
        if: matrix.lane == 'canonical'
        run: python -m unittest discover -s scripts -p 'test_ci_browser_runtime.py'
      - name: Verify pinned Chromium and WebKit startup
        id: canonical_startup
        if: matrix.lane == 'canonical'
        timeout-minutes: 2
        run: python scripts/verify_ci_browser_runtime.py
      - name: Install client for the pinned official WebKit runtime
        id: webkit_client
        if: matrix.lane == 'webkit'
        timeout-minutes: 15
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.txt
          python -m playwright --version
      - name: Verify deterministic WebKit retry contracts before browser suites
        id: webkit_contracts
        if: matrix.lane == 'webkit'
        run: python -m unittest discover -s scripts -p 'test_public_hydration_retry.py'
      - name: Diagnose WebKit browser startup
        id: webkit_startup
        if: matrix.lane == 'webkit'
        run: |
          mkdir -p webkit-test-results
          python - <<'PY' 2>&1 | tee webkit-test-results/browser-startup.log
          import platform
          from playwright.sync_api import sync_playwright
          print('Pinned runtime Python:', platform.python_version())
          with sync_playwright() as p:
              browser = p.webkit.launch(headless=True)
              page = browser.new_page()
              page.goto("about:blank")
              print("WebKit startup smoke: OK")
              browser.close()
          PY
      - name: Download validated Pages artifact
        id: download_artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: .pages-artifact
      - name: Extract validated Pages artifact
        id: extract_artifact
        run: |
          test ! -e dist
          mkdir dist
          tar -xf .pages-artifact/artifact.tar -C dist
      - name: Run canonical browser / PWA QA
        id: canonical_qa
        if: matrix.lane == 'canonical'
        run: npm run qa:browser
      - name: Verify the deployed artifact
        id: webkit_artifact
        if: matrix.lane == 'webkit'
        run: npm run verify:artifact
      - name: Verify real WebKit full-journey retry recovery and fail-closed injection
        id: webkit_retry
        if: matrix.lane == 'webkit'
        timeout-minutes: 12
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python scripts/public_hydration_qa.py --root dist --browser webkit --booking-only --retry-injection recover --artifacts webkit-test-results/retry-recover
          python scripts/public_hydration_qa.py --root dist --browser webkit --booking-only --retry-injection fail-second --artifacts webkit-test-results/retry-fail-second
      - name: Run WebKit mobile, public and startup QA
        id: webkit_qa
        if: matrix.lane == 'webkit'
        timeout-minutes: 20
        env:
          DEBUG: pw:browser
          PYTHONUNBUFFERED: '1'
        run: npm run test:webkit
      - name: Verify actual engine step outcomes
        id: engine_witness
        if: ${{ always() }}
        env:
          ENGINE_LANE: ${{ matrix.lane }}
          ENGINE_CANCELLED: '${{ cancelled() }}'
          ENGINE_STEPS: '${{ toJSON(steps) }}'
        run: |
          node --input-type=module <<'JS'
          import {engineOutcomeErrors} from './scripts/ci-browser-runtime-policy.mjs';
          try {
            const lane = process.env.ENGINE_LANE;
            const errors = engineOutcomeErrors({lane, cancelled: process.env.ENGINE_CANCELLED, steps: JSON.parse(process.env.ENGINE_STEPS)});
            if (errors.length) throw new Error(errors.join('; '));
            console.log(JSON.stringify({accepted: true, lane}));
          } catch (error) {
            console.error(JSON.stringify({accepted: false, error: error.message}));
            process.exitCode = 1;
          }
          JS
      - name: Upload browser evidence
        if: ${{ always() && matrix.lane == 'canonical' }}
        uses: actions/upload-artifact@v4
        with:
          name: vacleaner-browser-test-results
          path: |
            qa-release-summary.json
            test-results
            hydration-test-results
            admin-entrypoint-test-results
            pwa-test-results
            density-test-results
            final-desktop-test-results
            home-density-test-results
            equipment-density-test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload WebKit evidence
        if: ${{ always() && matrix.lane == 'webkit' }}
        uses: actions/upload-artifact@v4
        with:
          name: vacleaner-webkit-test-results
          path: webkit-test-results
          if-no-files-found: warn
          retention-days: 14

  operations:
    name: Production operations / ${{ matrix.browser }} / ${{ matrix.width }}
    runs-on: ubuntu-24.04
    needs: [classify, validate]
    if: needs.classify.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        width: [440, 1440]
    container:
      image: mcr.microsoft.com/playwright/python:v1.65.1-noble@sha256:0ab41a37431309d72b7a26f40ef1fdb464a62740196b2143965a2f59dc090409
      options: --ipc=host
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install client for the pinned official browser runtime
        timeout-minutes: 15
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Download reviewed production Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: production-pages
          path: .pages-artifact
      - name: Extract the exact production artifact without rebuilding
        run: |
          test ! -e release-candidate-test-results/dist
          mkdir -p release-candidate-test-results/dist
          tar -xf .pages-artifact/artifact.tar -C release-candidate-test-results/dist
      - name: Verify the reviewed production artifact receipt
        run: npm run verify:production-artifact
      - name: Test normal operations with all remote traffic intercepted
        run: python scripts/admin_release_candidate_qa.py --browser ${{ matrix.browser }} --width ${{ matrix.width }} --artifacts operations-test-results/${{ matrix.browser }}-${{ matrix.width }}
      - name: Verify current feedback and read-only detail freshness
        run: |
          python scripts/admin_ui_feedback_qa.py --root release-candidate-test-results/dist --browser ${{ matrix.browser }} --width ${{ matrix.width }} --artifacts operations-test-results/${{ matrix.browser }}-feedback-${{ matrix.width }}
          python scripts/admin_detail_live_refresh_qa.py --root release-candidate-test-results/dist --browser ${{ matrix.browser }} --width ${{ matrix.width }} --artifacts operations-test-results/${{ matrix.browser }}-detail-${{ matrix.width }}
      - name: Verify catalog scroll and booking order on the reviewed artifact
        run: |
          python scripts/admin_catalog_scroll_qa.py --root release-candidate-test-results/dist --browser ${{ matrix.browser }} --artifacts operations-test-results/${{ matrix.browser }}-catalog-${{ matrix.width }}
          python scripts/admin_booking_next_action_qa.py --root release-candidate-test-results/dist --browser ${{ matrix.browser }} --artifacts operations-test-results/${{ matrix.browser }}-queue-${{ matrix.width }}
      - name: Verify fleet state, rejected mutations and reload on the reviewed artifact
        run: python scripts/admin_equipment_fleet_qa.py --root release-candidate-test-results/dist --browser ${{ matrix.browser }} --artifacts operations-test-results/${{ matrix.browser }}-fleet-${{ matrix.width }}
      - name: Verify consistent Back navigation on the exact production artifact
        run: python scripts/admin_back_navigation_qa.py --root release-candidate-test-results/dist --browser ${{ matrix.browser }} --widths "${{ matrix.width == 440 && '320,390,440,956' || '1440' }}" --artifacts operations-test-results/${{ matrix.browser }}-back-${{ matrix.width }}
      - name: Verify narrow and landscape calendar containment and Settings focus
        if: matrix.width == 440
        run: |
          python scripts/admin_calendar_controls_qa.py --root release-candidate-test-results/dist --browser ${{ matrix.browser }} --widths 320,440,956 --artifacts operations-test-results/${{ matrix.browser }}-calendar-controls
          python scripts/admin_settings_focus_stepper_qa.py --root release-candidate-test-results/dist --browser ${{ matrix.browser }} --artifacts operations-test-results/${{ matrix.browser }}-settings-focus
          python scripts/admin_route_refresh_qa.py --root release-candidate-test-results/dist --browser ${{ matrix.browser }} --artifacts operations-test-results/${{ matrix.browser }}-route-refresh
      - name: Verify desktop calendar, status and contextual time controls
        if: matrix.width == 1440
        run: python scripts/admin_calendar_controls_qa.py --root release-candidate-test-results/dist --browser ${{ matrix.browser }} --widths 1440 --artifacts operations-test-results/${{ matrix.browser }}-calendar-controls-desktop
      - name: Test shipped mobile forms on the production artifact
        if: matrix.width == 440
        run: python scripts/mobile_forms_qa.py --browser ${{ matrix.browser }} --root release-candidate-test-results/dist --artifacts operations-test-results/${{ matrix.browser }}-forms
      - name: Test shipped public hydration on the production artifact
        if: matrix.width == 440
        run: python scripts/public_hydration_qa.py --browser ${{ matrix.browser }} --root release-candidate-test-results/dist --artifacts operations-test-results/${{ matrix.browser }}-public
      - name: Test shipped admin startup on the production artifact
        if: matrix.width == 440
        run: python scripts/admin_startup_qa.py --browser ${{ matrix.browser }} --root release-candidate-test-results/dist --artifacts operations-test-results/${{ matrix.browser }}-startup
      - name: Check out the immutable stable 4.3.46 worker reference
        if: matrix.width == 440
        uses: actions/checkout@v4
        with:
          ref: 15bf61dc4da4cf63405a25887353e6ec7178dce8
          path: stable-reference-test-results/source
          persist-credentials: false
      - name: Build the immutable stable reference for worker update and rollback QA
        if: matrix.width == 440
        working-directory: stable-reference-test-results/source
        run: |
          npm run stamp
          node scripts/build-pages.mjs
      - name: Test actual production worker offline, update and rollback
        if: matrix.width == 440
        run: python scripts/pwa_cache_qa.py --root release-candidate-test-results/dist --browser ${{ matrix.browser }} --width 440 --artifacts operations-test-results/${{ matrix.browser }}-pwa --stable-root stable-reference-test-results/source/dist
      - name: Upload production operations evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vacleaner-operations-${{ matrix.browser }}-${{ matrix.width }}
          path: operations-test-results
          if-no-files-found: warn
          retention-days: 14

  readiness:
    name: Release readiness
    if: ${{ always() }}
    needs: [classify, validate, engines, operations]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the actual event, classified lane and all gate results
        id: decision
        if: ${{ !cancelled() && success() }}
        env:
          READINESS_NEEDS: '${{ toJSON(needs) }}'
          READINESS_CANCELLED: 'false'
        run: node scripts/check-merge-readiness.mjs
      - name: Reject cancellation or an absent successful decision
        if: ${{ always() && (cancelled() || steps.decision.outcome != 'success') }}
        run: |
          echo 'Release readiness rejected: cancelled or decision did not succeed' >&2
          exit 1

  deploy:
    name: Deploy GitHub Pages
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate.result == 'success' && needs.engines.result == 'success' && needs.operations.result == 'success' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [validate, engines, operations]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: production-pages

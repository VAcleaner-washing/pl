name: Diagnose immutable46 worker rollback for 4367
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  worker-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2]
    container:
      image: mcr.microsoft.com/playwright/python:v1.65.1-noble@sha256:0ab41a37431309d72b7a26f40ef1fdb464a62740196b2143965a2f59dc090409
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3f79647533d666ef1fcb2951891ba10b2498a065
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: VAcleaner-washing/pl
          run-id: 44100107501
          artifact-ids: 14335183064
          path: .pages-artifact
          merge-multiple: true
      - name: Verify the exact reviewed production artifact
        run: |
          mkdir -p release-candidate-test-results/dist
          tar -xf .pages-artifact/artifact.tar -C release-candidate-test-results/dist
          npm run verify:production-artifact
      - uses: actions/checkout@v4
        with:
          ref: 15bf61dc4da4cf63405a25887353e6ec7178dce8
          path: stable-reference-test-results/source
      - name: Build the immutable stable46 reference using its own stamp
        working-directory: stable-reference-test-results/source
        run: |
          npm run stamp
          node scripts/build-pages.mjs
      - name: Add timeout diagnostics without altering readiness assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/pwa_cache_qa.py');s=p.read_text()
          old="snapshot = page.evaluate('()=>window.__vacPwaWorkerMonitor.last')"
          new="""snapshot = page.evaluate('''()=>({last:window.__vacPwaWorkerMonitor.last,pending:window.__vacPwaWorkerMonitor.pending,monitorReady:window.__vacPwaWorkerMonitor.ready,liveController:navigator.serviceWorker.controller?{state:navigator.serviceWorker.controller.state,scriptURL:navigator.serviceWorker.controller.scriptURL}:null,visibility:document.visibilityState})''')"""
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
      - name: Run the unchanged actual-worker assertions in a fresh browser
        run: python scripts/pwa_cache_qa.py --root release-candidate-test-results/dist --browser webkit --width 440 --stable-root stable-reference-test-results/source/dist --artifacts worker-diagnostic-test-results/trial-${{ matrix.trial }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-4367-trial-${{ matrix.trial }}
          path: worker-diagnostic-test-results
          if-no-files-found: warn
          retention-days: 14

name: Deploy VAcleaner Pages
on:
  push:
    branches:
      - main
      - 'qa/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static / build gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Stamp one build version
        run: npm run stamp
      - name: Validate static and backend release
        run: npm run check
      - name: Prevent stale copy and hydration mismatches
        run: npm run test:copy-integrity
      - name: Verify package naming and chemistry wording
        run: npm run test:package-language
      - name: Verify admin-controlled delivery settings
        run: npm run test:delivery-settings
      - name: Verify public SEO metadata and structured data
        run: npm run test:public-seo
      - name: Verify growth content and booking clarity
        run: npm run test:growth-content
      - name: Verify committed backend inventory snapshot
        run: npm run check:backend
      - name: Verify rental day and deposit policy
        run: npm run test:deposit-policy
      - name: Verify stabilization architecture
        run: npm run test:stabilization
      - name: Verify full public visual contract
        run: npm run test:public-visual-contract
      - name: Verify retention and promo rules
        run: npm run test:retention
      - name: Verify public booking CTA stability
        run: npm run test:booking-cta
      - name: Verify processing metadata and push copy
        run: npm run test:process-metadata
      - name: Verify peer-admin push and analytics layout
        run: npm run test:peer-admin-push
      - name: Verify issue payment workflow
        run: npm run test:issue-workflow
      - name: Verify financial control
        run: npm run test:financial-control
      - name: Verify operational health contract
        run: npm run test:operational-health
      - name: Verify analytics decision formulas
        run: npm run test:analytics
      - name: Verify Smart Guide decision logic
        run: npm run test:smart-guide-logic
      - name: Verify booking return defaults to next day
        run: npm run test:booking-date-default
      - name: Verify PWA static contract
        run: npm run test:pwa-static
      - name: Test SMS campaigns and consent
        run: npm run test:sms-campaigns
      - name: Verify admin auth refresh coordination
        run: npm run test:auth-refresh
      - name: Verify v4.1.28 campaign and phone-promo regressions
        run: npm run test:v4.1.28-regressions
      - name: Verify v4.1.29 promo issuance and v4.1.30 RETURN activation
        run: |
          npm run test:v4.1.29-promo-issuance
          npm run test:v4.1.30-return-activation
      - name: Verify v4.1.31 admin booking clarity
        run: npm run test:v4.1.31-admin-booking-meta
      - name: Verify v4.1.32 RETURN detach and booking hierarchy
        run: npm run test:v4.1.32-return-detach-ux
      - name: Verify v4.1.33 navigation and typography hierarchy
        run: npm run test:v4.1.33-navigation-typography
      - name: Verify address assist, suburbs and entrance-delivery UX
        run: |
          npm run test:v4.1.34-address-assist
          npm run test:v4.1.35-suburb-address
          npm run test:v4.1.36-delivery-entrance
      - name: Verify desktop booking address containment
        run: npm run test:v4.1.37-booking-address-overflow
      - name: Verify v4.1.39 admin visual polish
        run: npm run test:v4.1.39-admin-visual-polish
      - name: Verify v4.1.41 fulfillment UX and CI stability
        run: npm run test:v4.1.41-fulfillment-ux
      - name: Verify v4.1.44 booking hardening and smart entry
        run: npm run test:v4.1.44-booking-hardening
      - name: Verify v4.1.45 trust, cancellation and delivery rules
        run: npm run test:v4.1.45-trust-rules
      - name: Verify v4.1.46 booking funnel analytics
        run: npm run test:v4.1.46-funnel-analytics
      - name: Verify v4.1.47 SEO and Local SEO structure
        run: npm run test:v4.1.47-seo-local
      - name: Verify v4.1.47 Local SEO service-area patch
        run: npm run test:v4.1.47-area-patch
      - name: Verify v4.1.47.2 distance delivery pricing
        run: npm run test:v4.1.47.2-delivery-distance
      - name: Verify v4.1.48 content and local demand
        run: npm run test:v4.1.48-content-local-demand
      - name: Verify v4.1.49 performance and CI contract
        run: npm run test:v4.1.49-performance-ci
      - name: Verify v4.1.50 full QA and consistency
        run: npm run test:v4.1.50-full-qa
      - name: Verify v4.1.51 task choice and quiz positioning
        run: npm run test:v4.1.51-quiz-positioning
      - name: Verify v4.1.52 manual address delivery fallback
        run: npm run test:v4.1.52-manual-address-fallback
      - name: Verify v4.1.53 address provider repair
        run: npm run test:v4.1.53-address-provider-repair
      - name: Verify v4.1.54 local delivery zone correction
        run: npm run test:v4.1.54-local-zone-correction
      - name: Verify v4.1.55 clear advice and readable quiz guide
        run: npm run test:v4.1.55-clear-advice
      - name: Verify v4.1.56 package price alignment and delivery copy
        run: npm run test:v4.1.56-price-delivery-copy
      - name: Verify v4.1.57 analytics truth and source-of-truth stability
        run: npm run test:v4.1.57-analytics-truth
      - name: Verify v4.1.58 delivery zones and fuel economics
        run: npm run test:v4.1.58-delivery-zones
      - name: Verify v4.1.61 mobile homepage density contract
        run: npm run test:v4.1.61-mobile-density
      - name: Verify v4.1.62 Puzzi mobile density contract
        run: npm run test:v4.1.62-puzzi-density
      - name: Verify v4.1.63 stability and editorial readability
        run: npm run test:v4.1.63-stability-readability
      - name: Freeze green v4.1.63 admin, booking core and backend functions
        run: npm run test:v4.2.0-admin-function-freeze
      - name: Verify v4.2.0 modular public architecture
        run: npm run test:v4.2.0-public-architecture
      - name: Verify v4.2.1 referral business rules and integration
        run: npm run test:v4.2.1-referral
      - name: Verify v4.2.2 referral hardening and catalog source of truth
        run: npm run test:v4.2.2-hardening
      - name: Verify v4.2.5 compatibility with frozen v4.1.63 baseline
        run: npm run test:v4.2.5-baseline-compatibility
      - name: Verify v4.2.7 direct backend routes and internal auth resilience
        run: |
          npm run test:v4.2.7-backend-route-cleanup
          npm run check:backend
      - name: Verify v4.2.8 admin self-recovery
        run: npm run test:v4.2.8-recovery
      - name: Verify v4.2.9 referral client hub and conversion analytics
        run: npm run test:v4.2.9-referral-analytics
      - name: Verify v4.2.10 Telegram phone fallback
        run: npm run test:v4.2.10-referral-phone
      - name: Verify v4.2.11 admin cache bust
        run: npm run test:v4.2.11-cache-bust
      - name: Verify v4.2.12 referral client UX polish
        run: npm run test:v4.2.12-referral-ux
      - name: Verify v4.2.13 admin typography hierarchy
        run: npm run test:v4.2.13-admin-typography

      - name: Verify v4.2.14 admin ops UX
        run: npm run test:v4.2.14-admin-ops-ux

      - name: Verify v4.2.15 browser contracts
        run: npm run test:v4.2.15-browser-contracts
      - name: Verify v4.2.16 finance truth UX
        run: npm run test:v4.2.16-finance-truth
      - name: Verify v4.2.22 admin truth and UX contracts
        run: npm run test:v4.2.22-admin-truth-ux

      - name: Re-run admin functional contracts before architecture build
        run: |
          npm run test:admin-labels
          npm run test:client-promo-regression
          npm run test:calendar-live
          npm run test:booking-gifts
      - name: Build clean Pages artifact
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  browser:
    name: Browser QA aggregate gate
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Rebuild browser-test artifact
        run: |
          npm run stamp
          npm run build
      - name: Validate browser test sources
        run: |
          python -m py_compile scripts/e2e_smoke.py
          python -m py_compile scripts/public_booking_resilience_qa.py
          python -m py_compile scripts/test-public-inner-heroes.py
          python -m py_compile scripts/analytics_visual_qa.py
          python -m py_compile scripts/growth_visual_qa.py
          python -m py_compile scripts/content_v4148_visual_qa.py
          python -m py_compile scripts/home_mobile_density_qa.py
          python -m py_compile scripts/equipment_mobile_density_qa.py
          python -m py_compile scripts/v4200_visual_parity_qa.py
          python -m py_compile scripts/referral_admin_mobile_qa.py
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements-ci.txt') }}
      - name: Install Playwright browser tests
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.txt
          python -m playwright install --with-deps chromium
      - name: v4.2.0 visual parity QA
        id: v4200_parity
        continue-on-error: true
        run: npm run test:v4.2.0-visual-parity
      - name: Analytics visual QA
        id: analytics_visual
        continue-on-error: true
        run: npm run test:analytics-visual
      - name: Growth/public visual QA
        id: growth_visual
        continue-on-error: true
        run: npm run test:growth-visual
      - name: v4.1.48 content visual QA
        id: content_visual
        continue-on-error: true
        run: npm run test:v4.1.48-content-visual
      - name: Desktop and mobile booking smoke
        id: e2e
        continue-on-error: true
        run: npm run test:e2e
      - name: Public booking resilience QA
        id: public_booking
        continue-on-error: true
        run: npm run test:public-booking
      - name: Internal public hero visual QA
        id: inner_heroes
        continue-on-error: true
        run: npm run test:public-inner-heroes
      - name: Smart Guide fit QA
        id: smart_guide
        continue-on-error: true
        run: npm run test:smart-guide-fit
      - name: Mobile client card QA
        id: client_card
        continue-on-error: true
        run: npm run test:client-card-mobile
      - name: Referral admin mobile QA
        id: referral_mobile
        continue-on-error: true
        run: npm run test:referral-admin-mobile
      - name: Installed-PWA visual QA
        id: pwa
        continue-on-error: true
        run: npm run test:pwa
      - name: Campaign and SMS admin UX QA
        id: campaign_sms
        continue-on-error: true
        run: npm run test:campaign-sms-ux
      - name: Client completed-stats admin regression
        id: client_stats
        continue-on-error: true
        run: npm run test:client-stats-browser
      - name: Calendar admin viewport QA
        id: calendar_focused
        continue-on-error: true
        run: npm run test:calendar-focused
      - name: Admin keyboard and bottom-nav stability QA
        id: keyboard_nav
        continue-on-error: true
        run: npm run test:keyboard-nav-focus
      - name: Liquid Glass primary UX QA
        id: glass
        continue-on-error: true
        run: npm run test:glass-primary
      - name: Desktop density visual QA
        id: density
        continue-on-error: true
        run: npm run test:desktop-density
      - name: Final desktop visual audit
        id: desktop_final
        continue-on-error: true
        run: npm run test:desktop-final
      - name: Mobile homepage density QA
        id: home_density
        continue-on-error: true
        run: npm run test:home-mobile-density
      - name: Equipment mobile density QA
        id: equipment_density
        continue-on-error: true
        run: npm run test:equipment-mobile-density
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vacleaner-browser-test-results
          path: |
            test-results
            pwa-test-results
            density-test-results
            final-desktop-test-results
            home-density-test-results
            equipment-density-test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Browser QA aggregate gate
        if: always()
        env:
          V4200_PARITY: ${{ steps.v4200_parity.outcome }}
          ANALYTICS_VISUAL: ${{ steps.analytics_visual.outcome }}
          GROWTH_VISUAL: ${{ steps.growth_visual.outcome }}
          CONTENT_VISUAL: ${{ steps.content_visual.outcome }}
          E2E: ${{ steps.e2e.outcome }}
          PUBLIC_BOOKING: ${{ steps.public_booking.outcome }}
          INNER_HEROES: ${{ steps.inner_heroes.outcome }}
          SMART_GUIDE: ${{ steps.smart_guide.outcome }}
          CLIENT_CARD: ${{ steps.client_card.outcome }}
          REFERRAL_MOBILE: ${{ steps.referral_mobile.outcome }}
          PWA: ${{ steps.pwa.outcome }}
          CAMPAIGN_SMS: ${{ steps.campaign_sms.outcome }}
          CLIENT_STATS: ${{ steps.client_stats.outcome }}
          CALENDAR_FOCUSED: ${{ steps.calendar_focused.outcome }}
          KEYBOARD_NAV: ${{ steps.keyboard_nav.outcome }}
          GLASS: ${{ steps.glass.outcome }}
          DENSITY: ${{ steps.density.outcome }}
          DESKTOP_FINAL: ${{ steps.desktop_final.outcome }}
          HOME_DENSITY: ${{ steps.home_density.outcome }}
          EQUIPMENT_DENSITY: ${{ steps.equipment_density.outcome }}
        run: |
          failed=0
          for pair in \
            "v4200_parity=$V4200_PARITY" \
            "analytics_visual=$ANALYTICS_VISUAL" \
            "growth_visual=$GROWTH_VISUAL" \
            "content_visual=$CONTENT_VISUAL" \
            "e2e=$E2E" \
            "public_booking=$PUBLIC_BOOKING" \
            "inner_heroes=$INNER_HEROES" \
            "smart_guide=$SMART_GUIDE" \
            "client_card=$CLIENT_CARD" \
            "referral_mobile=$REFERRAL_MOBILE" \
            "pwa=$PWA" \
            "campaign_sms=$CAMPAIGN_SMS" \
            "client_stats=$CLIENT_STATS" \
            "calendar_focused=$CALENDAR_FOCUSED" \
            "keyboard_nav=$KEYBOARD_NAV" \
            "glass=$GLASS" \
            "density=$DENSITY" \
            "desktop_final=$DESKTOP_FINAL" \
            "home_density=$HOME_DENSITY" \
            "equipment_density=$EQUIPMENT_DENSITY"; do
            name="${pair%%=*}"; status="${pair#*=}"
            printf '%-24s %s\n' "$name" "$status"
            if [ "$status" != "success" ]; then failed=1; fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more browser suites failed. See every suite above; no later QA was skipped."
            exit 1
          fi

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [validate, browser]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

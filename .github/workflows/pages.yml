name: Deploy VAcleaner Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Stamp one build version
        run: npm run stamp
      - name: Validate static and backend release
        run: npm run check
      - name: Verify rental day and deposit policy
        run: npm run test:deposit-policy
      - name: Verify stabilization architecture
        run: npm run test:stabilization
      - name: Verify full public visual contract
        run: npm run test:public-visual-contract
      - name: Verify retention and promo rules
        run: npm run test:retention
      - name: Build clean Pages artifact
        run: npm run build
      - name: Validate browser test sources
        run: |
          python -m py_compile scripts/e2e_smoke.py
          python -m py_compile scripts/public_booking_resilience_qa.py
      - name: Install Playwright browser tests
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.txt
          python -m playwright install --with-deps chromium
      - name: Run desktop and mobile browser tests
        run: npm run test:e2e
      - name: Run public booking resilience QA
        run: npm run test:public-booking
      - name: Run installed-PWA visual QA
        run: npm run test:pwa
      - name: Run Liquid Glass primary UX QA
        run: npm run test:glass-primary
      - name: Run desktop density visual QA
        run: npm run test:desktop-density
      - name: Run final desktop visual audit
        run: npm run test:desktop-final
      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vacleaner-browser-test-results
          path: |
            test-results
            pwa-test-results
            density-test-results
            final-desktop-test-results
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

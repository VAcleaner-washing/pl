name: Probe strict WebKit form guards for 4367
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  strict-form-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright/python:v1.65.1-noble@sha256:0ab41a37431309d72b7a26f40ef1fdb464a62740196b2143965a2f59dc090409
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b1c1c383a016d8306b5da5017a1a70e12500a03b
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: VAcleaner-washing/pl
          run-id: 44104507440
          artifact-ids: 14338511513
          path: .pages-artifact
          merge-multiple: true
      - name: Verify canonical artifact and build isolated synthetic LAB
        run: |
          mkdir dist
          tar -xf .pages-artifact/artifact.tar -C dist
          npm run verify:artifact
          node scripts/build-admin-lab.mjs
      - name: Capture read-only form-event diagnostics on the isolated LAB
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lab-test-results/dist/assets/admin-lab-forms.js');s=p.read_text()
          marker='const dirty=form=>record(form).edited&&record(form).baseline!==snapshot(form);'
          probe="""
          window.__vacFormGuardEvents=[];
          for(const type of ['pointerdown','focusin','input','change','click'])document.addEventListener(type,event=>{
            const form=event.target.closest?.('form');if(form?.id!=='issueForm')return;
            const field=event.target, trusted=event.isTrusted;
            queueMicrotask(()=>{const value=records.get(form);window.__vacFormGuardEvents.push({type,trusted,name:field.name,fieldType:field.type,fieldValue:field.value,defaultValue:field.defaultValue,active:document.activeElement?.name,baseline:value?.baseline,current:snapshot(form),edited:value?.edited,interacted:value?.interacted})});
          },true);
          """
          assert s.count(marker)==1;p.write_text(s.replace(marker,marker+probe))
          p=Path('scripts/admin_lab_forms_qa.py');s=p.read_text()
          old="                expect(page.locator('#labLeaveDialog')).to_be_visible();keep()"
          start=s.index('# All common modal families');at=s.index(old,start)
          new="""                try:expect(page.locator('#labLeaveDialog')).to_be_visible()
                          except Exception:
                              print('FORM_GUARD_EVENTS '+json.dumps(page.evaluate('()=>window.__vacFormGuardEvents'),ensure_ascii=False),flush=True)
                              raise
                          keep()"""
          # Keep Python indentation at the original loop depth.
          new=new.replace('\n                          ','\n                ')
          p.write_text(s[:at]+s[at:].replace(old,new,1))
          PY
      - name: Run all original strict form and Escape assertions
        run: python scripts/admin_lab_forms_qa.py --browser webkit --artifacts forms-diagnostic-test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strict-webkit-4367-form-evidence
          path: forms-diagnostic-test-results
          if-no-files-found: warn
          retention-days: 14

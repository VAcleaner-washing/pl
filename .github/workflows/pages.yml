name: Deploy VAcleaner Pages
on:
  push:
    branches:
      - main
      - 'qa/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static / build gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair v4.3.6 System Spec once
        if: github.ref == 'refs/heads/qa/v4.3.6-finance-flow-clean' && contains(github.event.head_commit.message, 'temporary: repair spec through pages workflow')
        run: |
          git show 8fdec822bfbe8d1616b01468ae5c90498216e0bd:docs/VAcleaner-SYSTEM-SPEC.md > docs/VAcleaner-SYSTEM-SPEC.md
          printf '%s' '' | base64 --decode >> docs/VAcleaner-SYSTEM-SPEC.md
          git config user.name 'VAcleaner QA'
          git config user.email 'vacleaner.washing@gmail.com'
          git add docs/VAcleaner-SYSTEM-SPEC.md
          git commit -m 'v4.3.6: align System Spec with finance flow consistency'
          git push origin HEAD:${GITHUB_REF_NAME}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Run canonical static / regression QA
        run: npm run qa:static
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: dist

  browser:
    name: Browser QA aggregate gate
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements-ci.txt') }}
      - name: Install Playwright browser tests
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.txt
          python -m playwright install --with-deps chromium
      - name: Download validated Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: .pages-artifact
      - name: Extract validated Pages artifact
        run: |
          test ! -e dist
          mkdir dist
          tar -xf .pages-artifact/artifact.tar -C dist
      - name: Run canonical browser / PWA QA
        run: npm run qa:browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vacleaner-browser-test-results
          path: |
            qa-release-summary.json
            test-results
            pwa-test-results
            density-test-results
            final-desktop-test-results
            home-density-test-results
            equipment-density-test-results
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [validate, browser]
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

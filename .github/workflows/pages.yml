name: Publish verified VAcleaner 4361 release archives

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-archives-4361
  cancel-in-progress: false

jobs:
  publish-archives:
    if: >-
      github.repository == 'VAcleaner-washing/pl' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/release-artifacts/v4.3.61'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the actually deployed main production artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: VAcleaner-washing/pl
          run-id: 43607449279
          artifact-ids: 14119006400
          path: .deployed-production-artifact
          merge-multiple: true
      - name: Verify exact deployed ZIPs and publish release archives only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python release-packaging/publish.py --artifact-tar .deployed-production-artifact/artifact.tar
      - name: Retain publication receipt
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: release-4361-publication-receipt
          path: release-packaging-receipt.json
          if-no-files-found: error
          retention-days: 30

name: v4.3.13 System Spec append

on:
  push:
    branches:
      - qa/v4.3.13-admin-time-30min-ux

permissions:
  contents: write

jobs:
  append-spec:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v4.3.13-admin-time-30min-ux
          fetch-depth: 0
      - name: Append approved v4.3.13 contract
        shell: bash
        run: |
          if ! grep -q '^# 71. Change record — v4.3.13 ADMIN TIME PICKER UX$' docs/VAcleaner-SYSTEM-SPEC.md; then
            printf '%s' '' | base64 -d >> docs/VAcleaner-SYSTEM-SPEC.md
          fi
          rm .github/workflows/v4313-spec-append.yml
          git config user.name 'VAcleaner Release QA'
          git config user.email 'vacleaner.washing@gmail.com'
          git add docs/VAcleaner-SYSTEM-SPEC.md .github/workflows/v4313-spec-append.yml
          git commit -m 'docs(v4.3.13): define 30-minute admin time UX contract'
          git push origin HEAD:qa/v4.3.13-admin-time-30min-ux

name: v4.3.14 System Spec append
on:
  push:
    branches: [qa/v4.3.14-admin-time-bottom-sheet]
permissions:
  contents: write
jobs:
  append-spec:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v4.3.14-admin-time-bottom-sheet
          fetch-depth: 0
      - name: Append approved v4.3.14 contract
        shell: bash
        run: |
          if ! grep -q '^# 72. Change record — v4.3.14 ADMIN TIME BOTTOM SHEET$' docs/VAcleaner-SYSTEM-SPEC.md; then
            echo '' | base64 -d >> docs/VAcleaner-SYSTEM-SPEC.md
          fi
          rm .github/workflows/v4314-spec-append.yml
          git config user.name 'VAcleaner Release QA'
          git config user.email 'vacleaner.washing@gmail.com'
          git add docs/VAcleaner-SYSTEM-SPEC.md .github/workflows/v4314-spec-append.yml
          git commit -m 'docs(v4.3.14): define admin time bottom-sheet contract'
          git push origin HEAD:qa/v4.3.14-admin-time-bottom-sheet

name: TEMP v4.3.12 CSS fix
on:
  push:
    branches:
      - qa/v4.3.12-admin-time-logistics
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v4.3.12-admin-time-logistics
          fetch-depth: 0
      - name: Remove added specificity debt and self-remove
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/admin-v250.css')
          s=p.read_text(encoding='utf-8')
          old='#bookingForm .rental-moment .window-choice[hidden]{display:none!important}'
          new='#bookingForm .rental-moment .window-choice[hidden]{display:none}'
          if s.count(old) != 1:
              raise SystemExit(f'expected one v4.3.12 hidden rule, got {s.count(old)}')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          rm .github/workflows/temp-v4312-css-fix.yml
          git config user.name "VAcleaner-washing"
          git config user.email "vacleaner.washing@gmail.com"
          git add -A
          git commit -m "fix: restore admin CSS specificity budget"
          git push origin HEAD:qa/v4.3.12-admin-time-logistics

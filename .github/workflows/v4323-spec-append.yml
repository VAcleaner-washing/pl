name: v4.3.23 System Spec append

on:
  push:
    branches:
      - qa/v4.3.23-booking-filter-polish

permissions:
  contents: write

jobs:
  append-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v4.3.23-booking-filter-polish
          fetch-depth: 0
      - name: Append release record and remove helper
        shell: bash
        run: |
          set -euo pipefail
          marker='Change record — v4.3.23 BOOKING STATUS FILTER POLISH'
          if ! grep -Fq "$marker" docs/VAcleaner-SYSTEM-SPEC.md; then
            {
              printf '\n%s\n' '# 79. Change record — v4.3.23 BOOKING STATUS FILTER POLISH'
              printf '\n%s\n\n' '### ADDED'
              printf '%s\n' '- `assets/admin-v4323.css` adds a presentation-only mobile/PWA polish layer for the booking status filter rail.'
              printf '%s\n' '- `scripts/test-v4-3-23-booking-filter-polish.mjs` and `scripts/admin_booking_v4323_filter_polish_qa.py` lock the approved filter treatment at 320 / 390 / 430 px.'
              printf '\n%s\n\n' '### CHANGED'
              printf '%s\n' '- The booking status selector keeps the same four canonical filters but uses one calmer segmented surface with no internal vertical dividers.'
              printf '%s\n' '- Count values stay visible and move into the normal inline flow instead of floating in circular corner badges.'
              printf '%s\n' '- The active segment uses a restrained gold tint and subtle inset definition instead of a heavy outlined tile.'
              printf '%s\n' '- Narrow mobile widths allocate more room to the longer `Підтверджені` label while keeping all four filters visible.'
              printf '\n%s\n\n' '### FIXED'
              printf '%s\n' '- Removed the visually noisy divider-and-badge treatment that made the booking filter row look like a table.'
              printf '%s\n' '- Prevented the long confirmed-status label from feeling cramped on narrow iPhone widths.'
              printf '\n%s\n\n' '### PRESERVED'
              printf '%s\n' '- Filter labels, `data-filter` values, counts, click handlers, booking status semantics and list filtering remain unchanged.'
              printf '%s\n' '- Booking finance, pricing, deposits, prepayment, delivery, Supabase, RETURN/SMS/referral, availability, VA HOME and desktop behavior are unchanged.'
              printf '%s\n' '- Canonical package/build baseline remains `4.3.0 / 4300`.'
              printf '\n%s\n\n' '### TESTS'
              printf '%s\n' '- Static gate verifies v4.3.23 load order, service-worker cache inclusion, mobile scoping, inline counts and untouched filter semantics.'
              printf '%s\n' '- Browser gate verifies all four filters stay visible and clickable at 320 / 390 / 430 px, with no page or rail overflow, no heavy active border and no circular count badges.'
            } >> docs/VAcleaner-SYSTEM-SPEC.md
          fi
          git config user.name 'VAcleaner CI'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/v4323-spec-append.yml
          git add docs/VAcleaner-SYSTEM-SPEC.md
          git commit -m 'v4.3.23: document booking filter polish'
          git push origin HEAD:qa/v4.3.23-booking-filter-polish

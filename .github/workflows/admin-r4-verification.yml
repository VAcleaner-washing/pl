name: R4 full verification
on:
  push:
    branches: ['qa/admin-r4-full-verification']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r4-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lab-forms:
    name: LAB form policy / ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.61.0-noble@sha256:a9731514f24121d1dcd25d58d0a38146646d290a5998fd80d3e533e7b5e21c69
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install client for the pinned official browser image
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Build canonical shell and independent local-data LAB
        run: |
          npm run build
          npm run build:lab
      - name: Verify actual pending rejection acknowledgement and draft policy
        run: python scripts/admin_lab_forms_qa.py --browser ${{ matrix.browser }} --artifacts staging-ui-test-results/forms-${{ matrix.browser }}
      - name: Retain form-policy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4-form-policy-${{ matrix.browser }}
          path: staging-ui-test-results/forms-${{ matrix.browser }}
          retention-days: 14
  screens:
    name: Screens / ${{ matrix.browser }} / ${{ matrix.width }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.61.0-noble@sha256:a9731514f24121d1dcd25d58d0a38146646d290a5998fd80d3e533e7b5e21c69
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        width: [440, 1440]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install client for the pinned official browser image
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Build the actual generated R4 artifact
        run: |
          npm run build
          npm run build:staging-ui
      - name: Verify screens, forms, errors and recovery with isolated fixtures
        env:
          DEBUG: pw:browser
        run: python scripts/admin_staging_screens_qa.py --browser ${{ matrix.browser }} --width ${{ matrix.width }} --artifacts staging-ui-test-results/screens-${{ matrix.browser }}-${{ matrix.width }}
      - name: Retain result and screenshots including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4-screens-${{ matrix.browser }}-${{ matrix.width }}
          path: staging-ui-test-results/screens-${{ matrix.browser }}-${{ matrix.width }}
          retention-days: 14
  layout:
    name: Layout session / ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.61.0-noble@sha256:a9731514f24121d1dcd25d58d0a38146646d290a5998fd80d3e533e7b5e21c69
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 15bf61dc4da4cf63405a25887353e6ec7178dce8
          path: stable-reference-test-results/source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install client for the pinned official browser image
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Build immutable 46 navigation reference
        working-directory: stable-reference-test-results/source
        run: node scripts/build-pages.mjs
      - name: Build the actual generated R4 artifact
        run: |
          npm run build
          npm run build:staging-ui
      - name: Retain full multi-viewport session regression
        env:
          DEBUG: pw:browser
        run: python scripts/admin_staging_layout_qa.py --browser ${{ matrix.browser }} --artifacts staging-ui-test-results/layout-${{ matrix.browser }}
      - name: Retain result and geometry including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4-verification-layout-${{ matrix.browser }}
          path: staging-ui-test-results/layout-${{ matrix.browser }}
          retention-days: 14

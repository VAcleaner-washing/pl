[build]
  publish = "."  # файли в корені
  command = ""  # без збірки

[[plugins]]
  package = "@netlify/plugin-sitemap"
  [plugins.inputs]
    buildDir = "."  # файли в корені
    baseUrl = "https://vacleaner.pp.ua"  # твоя URL
    filePath = "sitemap.xml"  # шлях до карти

# Переносимо редирект окремо
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

[build]
  publish = "."  # Всі файли в корені
  command = ""  # Без збірки

[[plugins]]
  package = "@netlify/plugin-sitemap"
  [plugins.inputs]
    buildDir = "."  # Файли в корені
    baseUrl = "https://vacleaner.pp.ua"  # Базова URL сайту
    filePath = "sitemap.xml"  # Шлях до сайтмапу

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Robots-Tag = "all"
